name: simulator-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s eval -v
      - run: python -m compileall -q src scripts eval
      - run: python scripts/check_docs.py
      - run: python scripts/run_demo.py --scenario good
